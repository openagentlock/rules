schema_version: 1
id: rogue.cron-persistence
name: Block cron-based persistence installs
description: |
  Denies bash invocations that install or modify cron jobs: `crontab -`
  (read from stdin), `crontab <file>`, the canonical
  `(crontab -l; echo "<entry>") | crontab -` install pattern, redirects
  into `/etc/cron.*` or `/var/spool/cron/`, and `systemd-run --on-*`
  one-shot timers. MITRE ATT&CK T1053.003 catalogs cron as the most
  common Linux/macOS persistence technique; the Shai-Hulud npm worm
  (Sept 2025) used postinstall scripts to install cron jobs that
  re-fetched its C2 payload every minute.
severity: high
tags:
  - persistence
  - cron
  - mitre-t1053
  - bash
authors:
  - github: RonCodes88
license: Apache-2.0
compatible_agentlock: ">=0.1.0"
gate:
  match:
    tool: Bash
    any_command_regex:
      - '\bcrontab\s+-\s*$'
      - '\bcrontab\s+-\s*<'
      - '\bcrontab\s+/[^\s]+'
      - '\bcrontab\s+[^\s|;&-][^\s]*\.(?:cron|txt)\b'
      - '\)\s*\|\s*crontab\s+-'
      - '\}\s*\|\s*crontab\s+-'
      - '\becho\s+[^|]*\|\s*crontab\s+-'
      - '(?:>|>>)\s*/etc/cron(?:tab|\.(?:hourly|daily|weekly|monthly|d)/)'
      - '(?:>|>>)\s*/var/spool/cron/'
      - '\bsystemd-run\s+(?:[^|;&]*\s+)?--on-(?:calendar|active|boot|startup|unit-active|unit-inactive)\b'
      - '\bat\s+(?:now\s+\+|-f\s+|-t\s+)'
  evaluate:
    - kind: always
      action: deny
