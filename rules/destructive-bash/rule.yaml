schema_version: 1
id: rogue.destructive-bash
name: Block destructive shell commands
description: |
  Denies bash tool calls that match well-known destructive patterns:
  recursive force-removal, SQL DROP TABLE, dd over /dev/sd*, mkfs against
  block devices, and shell-piped curl into bash. The agent gets a clear
  explanation it can surface to the user.
severity: high
tags:
  - bash
  - shell
  - mcp
  - destructive
  - filesystem
authors:
  - github: openagentlock
license: Apache-2.0
compatible_agentlock: ">=0.1.0"
# any_of arms span every wire shape we see across harnesses:
#   tool: Bash         - Claude Code, Codex CLI
#   tool: Shell        - Cursor preToolUse + beforeShellExecution synthetic
#   tool_prefix: mcp_  - Claude Desktop (mcp__ double-underscore) and
#                        Gemini CLI (mcp_ single-underscore). Single-
#                        underscore prefix is a strict superset, so this
#                        one arm catches both wire shapes (whether the
#                        user wired an MCP shell-exec server or anything
#                        else MCP-namespaced that takes a `command` input).
gate:
  match:
    any_of:
      - tool: Bash
        any_command_regex: &destructive_bash_regex
          - 'rm\s+-rf?\s+/'
          - '(?i)DROP\s+TABLE'
          - 'dd\s+if=.*of=/dev/(?:sd|nvme|vd|xvd|hd|mmcblk|loop)'
          - 'mkfs\.'
          - 'curl\s+[^|]*\|\s*(ba)?sh'
      - tool: Shell
        any_command_regex: *destructive_bash_regex
      - tool_prefix: mcp_
        any_command_regex: *destructive_bash_regex
  evaluate:
    - kind: always
      action: deny
