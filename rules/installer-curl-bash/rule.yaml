schema_version: 1
id: supply-chain.installer-curl-bash
name: Block fetch-then-execute installer shapes (beyond curl|sh)
description: |
  Denies the broader family of "download-and-execute" patterns that
  the existing `rogue.destructive-bash` rule does not cover: write-
  then-run sequences (`curl -o file && bash file`), process
  substitution (`bash <(curl …)`), `eval $(curl …)`, language-runtime
  pipes (`curl … | python`, `… | node`, `… | ruby`), `wget -O- |
  bash`, and the equivalent shapes with `fetch`. These are the
  install primitives prompt-injected agents reach for when the
  attacker wants arbitrary code execution without leaving a clean
  artifact. They also appeared in the `Claude Fraud` campaign that
  used trust-signal lures to push first-stage loaders.
severity: high
tags:
  - supply-chain
  - installer
  - rce
  - bash
authors:
  - github: RonCodes88
license: Apache-2.0
compatible_agentlock: ">=0.1.0"
gate:
  match:
    tool: Bash
    any_command_regex:
      - '\bcurl\s+[^|;&]*\s+-o\s+\S+\s*&&\s*(?:bash|sh|zsh|python3?|node|ruby|perl|php)\s'
      - '\bwget\s+[^|;&]*\s+-O\s+\S+\s*&&\s*(?:bash|sh|zsh|python3?|node|ruby|perl|php)\s'
      - '\bwget\s+(?:[^|;&]*\s+)?-O\s*-\s+[^|]*\|\s*(?:bash|sh|zsh|python3?|node|ruby|perl|php)\b'
      - '\beval\s+["''`]?\$\((?:curl|wget|fetch)\s'
      - '\beval\s+["''`]\$\((?:curl|wget|fetch)[^)]*\)["''`]'
      - '\b(?:bash|sh|zsh)\s+<\(\s*(?:curl|wget|fetch)\s'
      - '\b(?:bash|sh|zsh)\s+-c\s+["''][^"'']*\$\((?:curl|wget|fetch)\s'
      - '\bcurl\s+[^|;&]*\|\s*python3?\b'
      - '\bcurl\s+[^|;&]*\|\s*(?:node|ruby|perl|php|deno|bun)\b'
      - '\bcurl\s+[^|;&]*\|\s*tee\s+[^|]*\|\s*(?:bash|sh)\b'
      - '\bcurl\s+[^|;&]*\|\s*xargs\s+(?:[^|;&]*\s+)?(?:bash|sh|node|python)\b'
      - '\bcurl\s+[^|;&]*\|\s*sudo\s+(?:bash|sh)\b'
      - '\bwget\s+[^|;&]*\|\s*(?:python3?|node|ruby|perl|php|deno|bun)\b'
      - '\bfetch\s+(?:[^|;&]*\s+)?-o\s*-\s+[^|]*\|\s*(?:bash|sh)\b'
      - '\b(?:bash|sh)\s+-c\s+["''][^"'']*(?:curl|wget)[^"'']*\|\s*(?:bash|sh)'
  evaluate:
    - kind: always
      action: deny
