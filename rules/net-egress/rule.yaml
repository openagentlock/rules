schema_version: 1
id: rogue.net-egress
name: Block bash POST / data egress over the network
description: |
  Denies bash curl / wget calls that ship data outbound: explicit
  POST/PUT/PATCH/DELETE methods, --data* / -d body uploads, and
  -F/--form multipart bodies. The match is intentionally on the
  *shape of egress* (sending data out) rather than on hostnames —
  the daemon's evaluator is RE2 and can't express a host-allowlist
  via negative-lookahead. A future `kind: allowlist` evaluator will
  let community rules ship a per-rule host allowlist; until then,
  fork this rule and add positive whitelists if you need exceptions.
severity: critical
tags:
  - exfil
  - egress
  - bash
  - net
authors:
  - github: openagentlock
license: Apache-2.0
compatible_agentlock: ">=0.1.0"
gate:
  match:
    tool: Bash
    any_command_regex:
      - '(?:curl|wget)\s+[^|;&]*-X\s*(?:POST|PUT|PATCH|DELETE)'
      - '(?:curl|wget)\s+[^|;&]*--data(?:-(?:binary|raw|urlencode|ascii))?(?:\s|=)'
      - '(?:curl|wget)\s+[^|;&]*\s-d(?:\s|=)'
      - '(?:curl|wget)\s+[^|;&]*\s-F(?:\s|=)'
      - '(?:curl|wget)\s+[^|;&]*--form(?:\s|=)'
      - '(?:curl|wget)\s+[^|;&]*--upload-file(?:\s|=)'
      - '(?:curl|wget)\s+[^|;&]*-T(?:\s|=)'
  evaluate:
    - kind: always
      action: deny
