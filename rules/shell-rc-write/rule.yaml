schema_version: 1
id: rogue.shell-rc-write
name: Block writes to shell rc files (bashrc, zshrc, profile)
description: |
  Denies modification of shell startup files: `~/.bashrc`,
  `~/.bash_profile`, `~/.zshrc`, `~/.zshenv`, `~/.zprofile`,
  `~/.profile`, fish config, and the system-wide variants in
  `/etc/`. Modifying a shell rc file is a textbook persistence
  move (every new shell session re-executes it) and a common
  credential-injection vector (an `export PROMPT_COMMAND='curl …
  $VAR'` line silently exfils on every prompt). It is also the
  shape an agent reaches for when it wants to "set up the
  environment" without operator review.
severity: high
tags:
  - persistence
  - shell
  - bash
  - zsh
  - mitre-t1546
  - write
  - edit
  - mcp
authors:
  - github: RonCodes88
license: Apache-2.0
compatible_agentlock: ">=0.1.0"
# any_of arms span every wire shape an agent can use to mutate these
# files. There are TWO classes of mutation:
#
#   1. Shell-side append/overwrite (`echo … >> ~/.bashrc`,
#      `tee -a ~/.zshrc`, `sed -i ... ~/.profile`):
#        tool: Bash                      - Claude Code, Codex CLI
#        tool: Shell                     - Cursor preToolUse + beforeShellExecution
#        tool_prefix: mcp_               - MCP shell-exec servers
#
#   2. Direct file-edit tools keyed on `file_path`:
#        tool: Write / Edit / MultiEdit  - Claude Code's three edit primitives
#        tool: Write                     - Cursor preToolUse
#        tool_prefix: mcp_               - MCP filesystem write servers
gate:
  match:
    any_of:
      - tool: Bash
        any_command_regex: &shell_rc_command_regex
          - '(?:>|>>)\s*~?/?\.bashrc(?:$|\s)'
          - '(?:>|>>)\s*~?/?\.bash_profile(?:$|\s)'
          - '(?:>|>>)\s*~?/?\.bash_login(?:$|\s)'
          - '(?:>|>>)\s*~?/?\.bash_aliases(?:$|\s)'
          - '(?:>|>>)\s*~?/?\.zshrc(?:$|\s)'
          - '(?:>|>>)\s*~?/?\.zshenv(?:$|\s)'
          - '(?:>|>>)\s*~?/?\.zprofile(?:$|\s)'
          - '(?:>|>>)\s*~?/?\.zlogin(?:$|\s)'
          - '(?:>|>>)\s*~?/?\.profile(?:$|\s)'
          - '(?:>|>>)\s*[^\s]*?/\.bashrc(?:$|\s)'
          - '(?:>|>>)\s*[^\s]*?/\.bash_profile(?:$|\s)'
          - '(?:>|>>)\s*[^\s]*?/\.bash_login(?:$|\s)'
          - '(?:>|>>)\s*[^\s]*?/\.zshrc(?:$|\s)'
          - '(?:>|>>)\s*[^\s]*?/\.zshenv(?:$|\s)'
          - '(?:>|>>)\s*[^\s]*?/\.zprofile(?:$|\s)'
          - '(?:>|>>)\s*[^\s]*?/\.zlogin(?:$|\s)'
          - '(?:>|>>)\s*[^\s]*?/\.profile(?:$|\s)'
          - '(?:>|>>)\s*[^\s]*?/\.config/fish/config\.fish(?:$|\s)'
          - '(?:>|>>)\s*/etc/(?:bashrc|bash\.bashrc|zshrc|profile|profile\.d/)'
          - '\btee\s+(?:-a\s+)?[^\s]*\.(?:bashrc|bash_profile|bash_login|bash_aliases|zshrc|zshenv|zprofile|zlogin|profile)\b'
          - '\bsed\s+-i\s+[^\s]+\s+[^\s]*\.(?:bashrc|bash_profile|bash_login|bash_aliases|zshrc|zshenv|zprofile|zlogin|profile)\b'
      - tool: Shell
        any_command_regex: *shell_rc_command_regex
      - tool_prefix: mcp_
        any_command_regex: *shell_rc_command_regex
      - tool: Write
        any_path_regex: &shell_rc_path_regex
          - '(?:^|/)\.bashrc$'
          - '(?:^|/)\.bash_profile$'
          - '(?:^|/)\.bash_aliases$'
          - '(?:^|/)\.bash_login$'
          - '(?:^|/)\.zshrc$'
          - '(?:^|/)\.zshenv$'
          - '(?:^|/)\.zprofile$'
          - '(?:^|/)\.zlogin$'
          - '(?:^|/)\.profile$'
          - '(?:^|/)\.config/fish/config\.fish$'
          - '^/etc/(?:bashrc|bash\.bashrc|zshrc|profile)(?:$|\.d/)'
          - '^/etc/profile\.d/'
      - tool: Edit
        any_path_regex: *shell_rc_path_regex
      - tool: MultiEdit
        any_path_regex: *shell_rc_path_regex
      - tool_prefix: mcp_
        any_path_regex: *shell_rc_path_regex
  evaluate:
    - kind: always
      action: deny
