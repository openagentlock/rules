schema_version: 1
id: rogue.system-auth-write
name: Block writes to system auth/identity/network files (sudoers, passwd, hosts, ssh)
description: |
  Denies modification of the canonical authentication, identity, and
  network-redirect files: `/etc/sudoers` and `/etc/sudoers.d/*`
  (privilege escalation), `/etc/passwd` and `/etc/shadow` (account
  creation), `/etc/hosts` and `/etc/resolv.conf` (DNS / domain
  hijacking), `/etc/ssh/sshd_config` and `/etc/pam.d/*` (auth-policy
  weakening), `/etc/nsswitch.conf` (name-resolution hijack), and
  `~/.ssh/authorized_keys` (the classic SSH backdoor primitive).
  These files are off-limits to any agent — modifications go through
  OS package management and human review, never through a coding
  assistant.
severity: critical
tags:
  - auth
  - persistence
  - system
  - ssh
  - mitre-t1098
  - write
  - edit
  - bash
  - shell
  - mcp
authors:
  - github: RonCodes88
license: Apache-2.0
compatible_agentlock: ">=0.1.0"
# any_of arms span every wire shape an agent can use to mutate these
# files. There are TWO classes of mutation; we cover both:
#
#   1. Direct file-edit tools keyed on `file_path`:
#        tool: Write / Edit / MultiEdit  - Claude Code's three edit primitives
#        tool: Write                     - Cursor preToolUse
#        tool_prefix: mcp_               - Claude Desktop (mcp__filesystem__write_file)
#                                          and Gemini (mcp_filesystem_write_file)
#
#   2. Shell-side mutations (`tee /etc/sudoers`, `echo … >> /etc/passwd`,
#      `sed -i ... /etc/sudoers`) keyed on `command`:
#        tool: Bash                      - Claude Code, Codex CLI
#        tool: Shell                     - Cursor (preToolUse + beforeShellExecution)
#        tool_prefix: mcp_               - MCP shell-exec servers
#
# Codex CLI has no native `Write`/`Edit` — file edits route through
# `apply_patch` which fires PreToolUse inconsistently per OpenAI
# codex#20204. The Bash arm above catches `tee`/`>>` shell-side shapes
# on Codex, which is the reliable path.
gate:
  match:
    any_of:
      - tool: Write
        any_path_regex: &system_auth_write_path_regex
          - '^/etc/sudoers(?:$|\.d/)'
          - '^/etc/passwd$'
          - '^/etc/shadow$'
          - '^/etc/group$'
          - '^/etc/gshadow$'
          - '^/etc/hosts$'
          - '^/etc/hostname$'
          - '^/etc/resolv\.conf$'
          - '^/etc/nsswitch\.conf$'
          - '^/etc/pam\.d/'
          - '^/etc/security/'
          - '^/etc/ssh/sshd_config(?:$|\.d/)'
          - '^/etc/ssh/ssh_host_'
          - '^/etc/ssh/ssh_config(?:$|\.d/)'
          - '(?:^|/)\.ssh/authorized_keys2?$'
          - '(?:^|/)\.ssh/config$'
          - '(?:^|/)\.ssh/known_hosts$'
          - '^/root/\.ssh/'
          - '^/etc/login\.defs$'
          - '^/etc/securetty$'
          - '^/etc/sub(?:uid|gid)$'
          - '^/etc/(?:hosts\.allow|hosts\.deny)$'
          - '^/etc/cron\.allow$'
          - '^/etc/cron\.deny$'
          - '^/etc/at\.allow$'
          - '^/private/etc/(?:sudoers|passwd|hosts|pam\.d|ssh)'
      - tool: Edit
        any_path_regex: *system_auth_write_path_regex
      - tool: MultiEdit
        any_path_regex: *system_auth_write_path_regex
      - tool_prefix: mcp_
        any_path_regex: *system_auth_write_path_regex
      - tool: Bash
        any_command_regex: &system_auth_write_command_regex
          - '\btee\s+(?:-a\s+)?/(?:private/)?etc/(?:sudoers|passwd|shadow|group|gshadow|hosts|hostname|resolv\.conf|nsswitch\.conf|pam\.d/|security/|ssh/|login\.defs|securetty|sub(?:uid|gid)|hosts\.(?:allow|deny)|cron\.(?:allow|deny)|at\.allow)'
          - '(?:>|>>)\s*/(?:private/)?etc/(?:sudoers|passwd|shadow|group|gshadow|hosts|hostname|resolv\.conf|nsswitch\.conf|pam\.d/|security/|ssh/|login\.defs|securetty|sub(?:uid|gid)|hosts\.(?:allow|deny)|cron\.(?:allow|deny)|at\.allow)'
          - '(?:>|>>)\s*~?/?\.ssh/authorized_keys2?\b'
          - '(?:>|>>)\s*[^\s]*?/\.ssh/authorized_keys2?\b'
          - '\btee\s+(?:-a\s+)?[^\s]*?/\.ssh/authorized_keys2?\b'
          - '\bsed\s+-i\s+[^\s]+\s+/(?:private/)?etc/(?:sudoers|passwd|shadow|group|gshadow|hosts|resolv\.conf|nsswitch\.conf|pam\.d/|ssh/sshd_config)'
      - tool: Shell
        any_command_regex: *system_auth_write_command_regex
      - tool_prefix: mcp_
        any_command_regex: *system_auth_write_command_regex
  evaluate:
    - kind: always
      action: deny
